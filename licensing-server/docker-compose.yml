# One-command local stack: Postgres + the licensing server.
#   MASTER_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))") \
#   docker compose up --build
# The server syncs the schema (prisma db push) on start, then listens on :8787.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: softglaze
      # audit: overridable so a deployment can set a strong password; the dev default
      # keeps `docker compose up` one-command. In production ALWAYS set POSTGRES_PASSWORD.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-softglaze}"
      POSTGRES_DB: softglaze_licensing
    ports:
      # audit: bind to loopback only. The server reaches Postgres over the compose
      # network (db:5432); publishing 0.0.0.0:5432 exposed the licensing DB (leases,
      # codes, tenant apiKeyHash, emails, payments) to any host that can reach the port.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U softglaze"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://softglaze:${POSTGRES_PASSWORD:-softglaze}@db:5432/softglaze_licensing?schema=public"
      MASTER_KEY: "${MASTER_KEY:?set MASTER_KEY (32-byte base64) in your shell before compose up}"
      PORT: "8787"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8787}"
      LEASE_DAYS: "7"
    # audit: dropped --accept-data-loss. On an empty DB `db push` just creates the schema
    # (no data loss); keeping the flag let a schema change silently DROP columns/tables of
    # live production data (licenses, payments, redeemed-code audit) on the next restart.
    command: sh -c "npx prisma db push --skip-generate && node src/server.js"
    ports:
      - "8787:8787"

volumes:
  pgdata:
