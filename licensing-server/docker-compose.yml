# One-command local stack: MySQL + the licensing server.
#   export MASTER_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
#   export DB_PASSWORD=$(node -e "console.log(require('crypto').randomBytes(24).toString('hex'))")
#   docker compose up --build
# The server syncs the schema (prisma db push) on start, then listens on :8787.
#
# Production runs on MySQL (the Hostinger deploy has no Postgres), so this schema's
# Prisma provider is `mysql`; this stack mirrors that locally.
#
# Security (audit T2-7): the database holds licences and sealed payment-provider
# secrets. The server reaches it over the compose network, so the port is bound to
# loopback only (for a local mysql client), and the password must come from the
# environment. Use a hex password: it goes into DATABASE_URL unescaped, and hex needs
# no URL encoding.
services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: softglaze_licensing
      MYSQL_USER: softglaze
      MYSQL_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD (random hex) in your shell before compose up}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD (random hex) in your shell before compose up}"
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 15

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "mysql://softglaze:${DB_PASSWORD:?set DB_PASSWORD}@db:3306/softglaze_licensing"
      MASTER_KEY: "${MASTER_KEY:?set MASTER_KEY (32-byte base64) in your shell before compose up}"
      PORT: "8787"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8787}"
      LEASE_DAYS: "7"
    command: sh -c "npx prisma db push --skip-generate --accept-data-loss && node src/server.js"
    # Loopback only, for the same reason as the database above. This service speaks
    # plain HTTP and holds the licence-signing keys; it must sit behind a reverse
    # proxy that terminates TLS, and the proxy reaches it here. Published on
    # 0.0.0.0 it would be on the internet directly, in front of that proxy — and
    # the desktop app refuses a non-HTTPS apiBaseUrl anyway (tenantConfig.js
    # sanitizeSecureUrl), so nothing legitimate needs the wider binding.
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  dbdata:
