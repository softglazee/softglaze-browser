name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Lint, build & unit tests
    runs-on: ubuntu-latest
    env:
      # Tests/build never launch a browser or Electron — skip those large
      # binary downloads to keep CI fast.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # With the binary skipped, require('electron') in a test DOWNLOADS it on first use,
      # and node --test runs test files in parallel processes, so several of them unpacked
      # it into the same folder at once ("File exists (os error 17)" -> "Electron failed
      # to install correctly"), failing a random test. Under plain node the tests only
      # get the binary's path, never run it, so point that path at a dummy folder.
      ELECTRON_OVERRIDE_DIST_PATH: '/tmp/electron-not-installed'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for undeclared dependencies
        run: npm run check:deps

      - name: Build renderer
        run: npx vite build

      - name: Syntax-check main + preload
        run: |
          set -e
          find src/main src/preload -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done

      - name: Unit tests
        run: npm test

  package:
    name: Package Windows build (no publish)
    runs-on: windows-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npx vite build

      - name: Package unpacked app (build-only)
        # Smoke test only: skip exe edit/sign so electron-builder never fetches
        # winCodeSign (its 7z carries a macOS symlink that fails to extract on a
        # fresh Windows runner — "Cannot create symbolic link"). The real signed
        # build (npm run build:electron, run locally with the cert) keeps full
        # icon + version patching and signing.
        run: npx electron-builder --dir --publish never --config.win.signAndEditExecutable=false
