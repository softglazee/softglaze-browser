name: Release builds

# Builds installable artifacts for Windows, macOS and Linux from one matrix.
# Trigger it manually (Actions -> Release builds -> Run workflow) or by pushing a
# v* tag matching package.json, e.g. `git tag v1.0.7 && git push origin v1.0.7`.
#
# On a TAG it now also uploads the installers to a GitHub Release, which
# electron-builder creates as a DRAFT: nothing is public until it is reviewed and
# published in the Releases UI. A manual run still only produces workflow
# artifacts, so the Actions tab stays usable for throwaway test builds.
#
# macOS is UNSIGNED until an Apple Developer certificate is supplied as the
# CSC_LINK / CSC_KEY_PASSWORD secrets; Gatekeeper will warn on first open.
# Every OS also keeps its installers as workflow artifacts, so a rejected upload
# never costs the build.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

# electron-builder needs this to create the release and upload assets to it.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            builder_args: --win --x64
          - os: macos-latest
            platform: macos
            # Intel and Apple Silicon. prisma/schema.prisma already lists both
            # darwin engines, so one runner can package both arches.
            builder_args: --mac --x64 --arm64
          - os: ubuntu-latest
            platform: linux
            builder_args: --linux --x64
    runs-on: ${{ matrix.os }}
    env:
      # The app never launches a real Chrome/Electron during build; skip those
      # large downloads.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Licensed build when the SG_TENANT_CONFIG_JSON secret is set: the licensing
      # tenant is baked in exactly like the website installer (build-tenant.js
      # --bake-only), so trials and plans work. The config holds only the tenant
      # id, the API URL and the server's PUBLIC key. Without the secret (for
      # example on a fork) the build falls back to a base build with no
      # licensing backend, which must never be shipped to customers.
      SG_ALLOW_BASE_BUILD: ${{ secrets.SG_TENANT_CONFIG_JSON == '' && '1' || '0' }}
      # No Apple certificate in CI yet: tell electron-builder not to hunt for one,
      # so the macOS build completes unsigned instead of failing.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # After the tests (they expect the empty base config) and before anything
      # is built from src/.
      - name: Bake the licensing tenant
        if: env.SG_ALLOW_BASE_BUILD != '1'
        shell: bash
        env:
          TENANT_JSON: ${{ secrets.SG_TENANT_CONFIG_JSON }}
        run: |
          printf '%s' "$TENANT_JSON" > "$RUNNER_TEMP/tenant.config.json"
          node scripts/build-tenant.js "$RUNNER_TEMP/tenant.config.json" --bake-only
          rm -f "$RUNNER_TEMP/tenant.config.json"

      - name: Check the build is licensed (or an explicit base build)
        run: node scripts/check-tenant-baked.js

      - name: Build renderer
        run: npx vite build

      - name: Build bundled Firefox autofill extension
        run: node scripts/build-firefox-ext.mjs

      - name: Generate Prisma client (this OS's engine)
        run: npx prisma generate

      # A tag is a release: publish. Anything else (a manual run) stays a private
      # test build and only produces the workflow artifacts below.
      - name: Package installers and publish to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder ${{ matrix.builder_args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package installers (no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: softglaze-${{ matrix.platform }}
          path: |
            dist_installer/*.exe
            dist_installer/*.dmg
            dist_installer/*.AppImage
            dist_installer/*.deb
          if-no-files-found: ignore
